<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fresh Export Online - SheetDB Version</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
    body { background: #0f111a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Bar */
    #top-bar { height: 45px; background: #1a1d2e; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 13px; font-weight: bold; border-bottom: 2px solid #2a2e45; }
    .gold { color: #f1c40f; } .green { color: #2ecc71; }

    /* Main Container & Tabs */
    #main-screen { flex: 1; position: relative; overflow: hidden; }
    .tab-page { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: none; padding: 15px; overflow-y: auto; background: #0f111a; }
    .tab-page.active { display: block; }

    /* UI Cards & Buttons */
    .card { background: #1a1d2e; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #3b3f5c; }
    .card.green-board { border-left-color: #2ecc71; }
    .card.yellow-board { border-left-color: #f1c40f; }
    .btn { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn:active { transform: scale(0.98); }
    .btn-temp { background: #2980b9; padding: 5px 10px; font-size: 12px; }

    /* Temp Bar */
    .temp-bar { height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .temp-fill { height: 100%; width: 50%; transition: 0.2s; }

    /* Bottom Nav */
    #bottom-nav { height: 60px; background: #1a1d2e; display: flex; border-top: 2px solid #2a2e45; }
    .nav-item { flex: 1; background: none; border: none; color: #7f8c8d; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .nav-item.active { color: #2ecc71; font-weight: bold; background: #252940; }

    /* Auth Screen Overlay */
    #auth-screen { position: fixed; inset: 0; background: #0f111a; z-index: 999; display: flex; align-items: center; justify-content: center; }
    .auth-box { background: #1a1d2e; padding: 25px; border-radius: 12px; width: 310px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    .auth-box input { width: 100%; padding: 10px; margin: 8px 0; background: #0f111a; border: 1px solid #333; color: white; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <h2 style="color:#2ecc71; margin-bottom: 10px;">Fresh Export (SheetDB)</h2>
      <input type="text" id="acc-user" placeholder="Username">
      <input type="password" id="acc-pass" placeholder="Password">
      <input type="text" id="acc-name" placeholder="Display Name (สำหรับสมัครใหม่)">
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="handleLogin()">เข้าสู่ระบบ</button>
      <button class="btn" style="width: 100%; background: #34495e; margin-top: 5px;" onclick="handleRegister()">ลงทะเบียน</button>
      <p id="auth-status" style="font-size: 11px; color: #e74c3c; margin-top: 10px;"></p>
    </div>
  </div>

  <div id="top-bar">
    <div>ID: <span id="ui-id" class="green">10000001</span></div>
    <div>บริษัท: <span id="ui-name">CEO_Player</span></div>
    <div>เงินทุน: <span id="ui-money" class="gold">$1,000</span></div>
  </div>

  <div id="main-screen">
    
    <div id="page-game" class="tab-page active" style="padding:0;">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="page-orders" class="tab-page">
      <h3 style="margin-bottom:10px;">📦 คำสั่งซื้อสินค้า (Orders)</h3>
      <div id="orders-container"></div>
    </div>

    <div id="page-export" class="tab-page">
      <h3 style="margin-bottom:10px;">🚚 ไลน์การส่งออก & คุมอุณหภูมิ</h3>
      <div id="export-container"></div>
    </div>

    <div id="page-leaderboard" class="tab-page">
      <h3 style="margin-bottom:10px;">🏆 อันดับตารางแข่งขัน (% รายได้)</h3>
      <div id="leaderboard-container"></div>
    </div>

    <div id="page-profile" class="tab-page">
      <h3>👤 โปรไฟล์ผู้เล่น</h3>
      <div class="card" style="margin-top:10px;">
        <p>User ID: <b id="prof-id">10000001</b></p>
        <p>ยอดเงินรวมสะสม: <b id="prof-money" class="gold">$1,000</b></p><br>
        <label>เปลี่ยนชื่อบริษัท/Display Name:</label>
        <input type="text" id="edit-display-name" style="width:100%; padding:8px; margin:8px 0; background:#0f111a; color:white; border:1px solid #333; border-radius:4px;">
        <button class="btn" onclick="saveProfileName()">บันทึกเปลี่ยนชื่อ</button>
      </div>
    </div>

  </div>

  <div id="bottom-nav">
    <button class="nav-item active" onclick="switchTab('game', this)"><span>🏢</span>คลังสินค้า</button>
    <button class="nav-item" onclick="switchTab('orders', this)"><span>📦</span>ออร์เดอร์</button>
    <button class="nav-item" onclick="switchTab('export', this)"><span>🚚</span>ไลน์ส่งออก</button>
    <button class="nav-item" onclick="switchTab('leaderboard', this)"><span>🏆</span>อันดับ</button>
    <button class="nav-item" onclick="switchTab('profile', this)"><span>👤</span>โปรไฟล์</button>
  </div>

<script>
  // 🔴 นำ API URL จาก SheetDB มาใส่ตรงนี้ 🔴
  const SHEETDB_URL = "https://sheetdb.io/api/v1/my2ssyufztwjb";

  let userState = {
    userId: 10000001,
    username: "",
    displayName: "CEO_Player",
    totalMoney: 1000,
    startMoney: 1000
  };

  let activeOrders = [];
  let shippingTrucks = [];

  // --- SheetDB Authentication System ---

  // 1. เข้าสู่ระบบ (GET search)
  async function handleLogin() {
    const u = document.getElementById('acc-user').value.trim();
    const p = document.getElementById('acc-pass').value.trim();
    const status = document.getElementById('auth-status');

    if (!u || !p) return status.innerText = "กรุณากรอก Username และ Password";

    status.style.color = "#f1c40f";
    status.innerText = "กำลังเข้าสู่ระบบ...";

    try {
      const res = await fetch(`${SHEETDB_URL}/search?Username=${encodeURIComponent(u)}&Password=${encodeURIComponent(p)}`);
      const data = await res.json();

      if (data.length > 0) {
        const userData = data[0];
        userState.userId = parseInt(userData["User ID"]);
        userState.username = userData["Username"];
        userState.displayName = userData["Display Name"];
        userState.totalMoney = parseInt(userData["Total Money"]) || 1000;
        userState.startMoney = userState.totalMoney;

        // อัปเดตเวลาเข้าใช้งานล่าสุด (PATCH)
        const now = new Date().toISOString();
        fetch(`${SHEETDB_URL}/User ID/${userState.userId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: { "Last Login Time": now } })
        });

        document.getElementById('auth-screen').style.display = 'none';
        updateUI();
        initCanvasGame();
        startOrderGenerator();
      } else {
        status.style.color = "#e74c3c";
        status.innerText = "Username หรือ Password ไม่ถูกต้อง";
      }
    } catch (err) {
      status.style.color = "#e74c3c";
      status.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ SheetDB";
    }
  }

  // 2. ลงทะเบียน (POST Data)
  async function handleRegister() {
    const u = document.getElementById('acc-user').value.trim();
    const p = document.getElementById('acc-pass').value.trim();
    const n = document.getElementById('acc-name').value.trim() || u;
    const status = document.getElementById('auth-status');

    if (!u || !p) return status.innerText = "กรุณากรอกข้อมูลให้ครบถ้วน";

    status.style.color = "#f1c40f";
    status.innerText = "กำลังลงทะเบียน...";

    try {
      // เช็กก่อนว่ามี Username นี้หรือยัง
      const checkRes = await fetch(`${SHEETDB_URL}/search?Username=${encodeURIComponent(u)}`);
      const checkData = await checkRes.json();

      if (checkData.length > 0) {
        status.style.color = "#e74c3c";
        return status.innerText = "Username นี้ถูกใช้งานแล้ว";
      }

      // ดึงข้อมูลทั้งหมดเพื่อคำนวณ User ID ถัดไป (เริ่มที่ 10000001)
      const allRes = await fetch(SHEETDB_URL);
      const allData = await allRes.json();
      const newId = 10000001 + allData.length;
      const now = new Date().toISOString();

      const newUser = {
        "User ID": newId,
        "Username": u,
        "Password": p,
        "Last Login Time": now,
        "Display Name": n,
        "Total Money": 1000
      };

      await fetch(SHEETDB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: [newUser] })
      });

      userState = {
        userId: newId,
        username: u,
        displayName: n,
        totalMoney: 1000,
        startMoney: 1000
      };

      document.getElementById('auth-screen').style.display = 'none';
      updateUI();
      initCanvasGame();
      startOrderGenerator();
    } catch (err) {
      status.style.color = "#e74c3c";
      status.innerText = "ไม่สามารถลงทะเบียนได้";
    }
  }

  // 3. เปลี่ยนชื่อโปรไฟล์ (PATCH)
  async function saveProfileName() {
    const newName = document.getElementById('edit-display-name').value.trim();
    if (!newName) return;

    userState.displayName = newName;
    updateUI();

    await fetch(`${SHEETDB_URL}/User ID/${userState.userId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { "Display Name": newName } })
    });
    alert('บันทึกการเปลี่ยนชื่อเรียบร้อยแล้ว!');
  }

  // 4. บันทึกเงินลง Google Sheets (PATCH)
  async function saveMoneyToSheet() {
    fetch(`${SHEETDB_URL}/User ID/${userState.userId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { "Total Money": userState.totalMoney } })
    });
  }

  // --- UI & Game Logic ---

  function updateUI() {
    document.getElementById('ui-id').innerText = userState.userId;
    document.getElementById('ui-name').innerText = userState.displayName;
    document.getElementById('ui-money').innerText = '$' + userState.totalMoney.toLocaleString();
    document.getElementById('prof-id').innerText = userState.userId;
    document.getElementById('prof-money').innerText = '$' + userState.totalMoney.toLocaleString();
    document.getElementById('edit-display-name').value = userState.displayName;
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + tabId).classList.add('active');
    btn.classList.add('active');

    if (tabId === 'orders') renderOrdersUI();
    if (tabId === 'export') renderExportUI();
    if (tabId === 'leaderboard') loadLeaderboard();
  }

  // ดึงตารางอันดับ % รายได้จาก SheetDB
  async function loadLeaderboard() {
    const container = document.getElementById('leaderboard-container');
    container.innerHTML = '<p style="color:#888;">กำลังโหลดอันดับจากตาราง...</p>';

    try {
      const res = await fetch(SHEETDB_URL);
      const data = await res.json();

      // เรียงลำดับตาม Total Money จากมากไปน้อย
      data.sort((a, b) => (parseInt(b["Total Money"]) || 0) - (parseInt(a["Total Money"]) || 0));

      container.innerHTML = '';
      data.forEach((player, idx) => {
        const money = parseInt(player["Total Money"]) || 1000;
        const pct = (((money - 1000) / 1000) * 100).toFixed(1);
        const isMe = player["User ID"] == userState.userId;

        container.innerHTML += `
          <div class="card" style="${isMe ? 'border-left-color:#2ecc71; background:#252940;' : ''}">
            <span>${idx ===
