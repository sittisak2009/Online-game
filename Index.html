<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fresh Export Logistics - Playable Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Stats Bar */
    #top-bar {
      height: 45px; background: #1e1e24; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid #333; font-size: 13px; font-weight: bold;
    }
    .val { color: #2ecc71; }

    /* Game Viewport */
    #game-container { flex: 1; position: relative; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Action Overlay Notification */
    #action-msg {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); border: 1px solid #2ecc71; color: #fff;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; pointer-events: none; text-align: center; display: none;
    }

    /* On-Screen Mobile Joystick Controls */
    #touch-controls {
      position: absolute; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 45px); grid-template-rows: repeat(3, 45px); gap: 5px; z-index: 10;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white;
      border-radius: 8px; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; active { background: #2ecc71; }
    }

    /* Interactive Action Button */
    #interact-btn {
      position: absolute; bottom: 25px; right: 25px; width: 70px; height: 70px;
      background: #e76f51; border: 2px solid #fff; color: white; border-radius: 50%;
      font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #interact-btn:active { transform: scale(0.95); background: #f4a261; }

    /* Bottom Nav */
    #bottom-nav { height: 55px; background: #1e1e24; display: flex; border-top: 1px solid #333; }
    .nav-btn { flex: 1; background: none; border: none; color: #888; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .nav-btn.active { color: #2ecc71; font-weight: bold; background: #25252e; }
  </style>
</head>
<body>

  <div id="top-bar">
    <div>ID: <span class="val" id="ui-id">10000001</span></div>
    <div>เงิน: <span class="val" id="ui-money">$1,000</span></div>
    <div>พืชผลในตัว: <span class="val" id="ui-crop">0/100</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="action-msg">เดินเข้าใกล้โซนเพื่อทำงาน</div>

    <!-- Touch Controls for Mobile -->
    <div id="touch-controls">
      <div></div><button class="ctrl-btn" id="btn-up">▲</button><div></div>
      <button class="ctrl-btn" id="btn-left">◄</button><div></div><button class="ctrl-btn" id="btn-right">►</button>
      <div></div><button class="ctrl-btn" id="btn-down">▼</button><div></div>
    </div>

    <button id="interact-btn" onclick="doAction()">กดทำงาน<br>(SPACE)</button>
  </div>

  <div id="bottom-nav">
    <button class="nav-btn active">🏢 คลังสินค้า</button>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Game Data
  let money = 1000;
  let playerCrop = 0;
  const maxCrop = 100;

  // Player Object
  let player = { x: 150, y: 150, size: 20, speed: 3.5 };

  // Zones in Warehouse
  const zones = {
    farm: { x: 50, y: 50, w: 100, h: 80, label: "🌱 โซนเก็บเกี่ยว", color: "#2ecc71" },
    truck: { x: 260, y: 50, w: 120, h: 80, label: "🚚 ตู้ส่งออก (คุมแอร์)", color: "#e76f51" }
  };

  // Truck Temp Logic
  let truckTemp = 28; // อุณหภูมิห้อง
  let targetTemp = 4; // อุณหภูมิเป้าหมาย
  let tempTimer = 0;

  // Movement Controls
  let keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.code==='Space') doAction(); });
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  // Touch Support
  const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
  };
  bindTouch('btn-up', 'w'); bindTouch('btn-down', 's');
  bindTouch('btn-left', 'a'); bindTouch('btn-right', 'd');

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Interaction Logic
  function nearZone(z) {
    return player.x > z.x - 20 && player.x < z.x + z.w + 20 &&
           player.y > z.y - 20 && player.y < z.y + z.h + 20;
  }

  function doAction() {
    if (nearZone(zones.farm)) {
      if (playerCrop < maxCrop) {
        playerCrop += 20;
        showMsg("🌱 เก็บเกี่ยวพืชผล +20!");
      } else {
        showMsg("⚠️ ของเต็มกระเป๋าแล้ว! นำไปส่งที่ตู้ส่งออก");
      }
    } else if (nearZone(zones.truck)) {
      if (playerCrop > 0) {
        // คำนวณเงินตามเกรดอุณหภูมิ
        let diff = Math.abs(truckTemp - targetTemp);
        let reward = diff <= 3 ? 500 : (diff <= 8 ? 250 : 50);
        money += reward;
        showMsg(`🚚 โหลดสินค้าส่งออกสำเร็จ! ได้รับเงิน $${reward}`);
        playerCrop = 0;
      } else {
        // ถ้าไม่มีของ ให้เป็นการปรับแอร์ตู้ส่งออก
        truckTemp = Math.max(-5, truckTemp - 3);
        showMsg(`❄️ เปิดแอร์ลดอุณหภูมิเหลือ ${truckTemp}°C`);
      }
    }
    updateUI();
  }

  function showMsg(text) {
    const msg = document.getElementById('action-msg');
    msg.innerText = text;
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
  }

  function updateUI() {
    document.getElementById('ui-money').innerText = '$' + money;
    document.getElementById('ui-crop').innerText = `${playerCrop}/${maxCrop}`;
  }

  // Main Loop
  function update() {
    // Movement
    if (keys['w'] || keys['arrowup']) player.y -= player.speed;
    if (keys['s'] || keys['arrowdown']) player.y += player.speed;
    if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
    if (keys['d'] || keys['arrowright']) player.x += player.speed;

    // Boundaries
    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    // Simulation: Temp rises over time
    tempTimer++;
    if (tempTimer % 180 === 0) { // ทุกๆ 3 วินาที แอร์จะอุ่นขึ้น
      truckTemp++;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid Floor
    ctx.strokeStyle = '#1a1a1a';
    for (let x = 0; x < canvas.width; x += 30) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Draw Zones
    for (let key in zones) {
      let z = zones[key];
      ctx.fillStyle = z.color;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.globalAlpha = 1.0;
      ctx.strokeStyle = z.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(z.x, z.y, z.w, z.h);

      ctx.fillStyle = "#fff";
      ctx.font = "12px sans-serif";
      ctx.fillText(z.label, z.x + 5, z.y + 20);
    }

    // Display Truck Temp
    ctx.fillStyle = "#fff";
    ctx.font = "11px sans-serif";
    let tempDiff = Math.abs(truckTemp - targetTemp);
    let grade = tempDiff <= 3 ? "🟢 เขียว (สดมาก)" : (tempDiff <= 8 ? "🟡 เหลือง (พอใช้)" : "🔴 แดง (เน่า)");
    ctx.fillText(`อุณหภูมิ: ${truckTemp}°C (เป้าหมาย ${targetTemp}°C)`, zones.truck.x + 5, zones.truck.y + 45);
    ctx.fillText(`เกรด: ${grade}`, zones.truck.x + 5, zones.truck.y + 65);

    // Draw Player
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();

    // Check interaction prompt
    if (nearZone(zones.farm)) {
      ctx.fillStyle = "#2ecc71";
      ctx.fillText("กดทำงานเพื่อเก็บพืช", player.x - 40, player.y - 25);
    } else if (nearZone(zones.truck)) {
      ctx.fillStyle = "#e76f51";
      ctx.fillText("กดทำงานเพื่อส่งของ/กดลดอุณหภูมิ", player.x - 70, player.y - 25);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
