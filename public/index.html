<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Battle Arena ⚔️</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white font-['Kanit'] min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-black">

    <!-- Background Glow Effect -->
    <div class="fixed inset-0 bg-gradient-to-tr from-cyan-950/30 via-slate-950 to-purple-950/30 pointer-events-none"></div>

    <main class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl shadow-cyan-950/50">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent italic">
                ⚔️ MATH BATTLE
            </h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Real-time Arena 1v1</p>
        </header>

        <!-- Status Bar -->
        <div id="status" class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 text-center text-sm font-medium text-amber-400 flex items-center justify-center gap-2 mb-6 shadow-inner">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
            <span id="status-text">กำลังเชื่อมต่อกับเซิร์ฟเวอร์...</span>
        </div>

        <!-- Game Box -->
        <div id="game-box" class="hidden space-y-6">
            
            <!-- Scoreboard -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-b from-cyan-950/40 to-slate-950 border border-cyan-500/30 rounded-2xl p-3 text-center">
                    <p class="text-xs text-cyan-400 font-semibold uppercase tracking-wider">YOU</p>
                    <p id="my-score" class="text-3xl font-black text-cyan-300 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">0</p>
                </div>
                <div class="bg-gradient-to-b from-rose-950/40 to-slate-950 border border-rose-500/30 rounded-2xl p-3 text-center">
                    <p class="text-xs text-rose-400 font-semibold uppercase tracking-wider">ENEMY</p>
                    <p id="opponent-score" class="text-3xl font-black text-rose-400 drop-shadow-[0_0_10px_rgba(251,113,133,0.5)]">0</p>
                </div>
            </div>

            <!-- Problem display -->
            <div class="relative bg-slate-950/80 border border-slate-800 rounded-2xl py-8 text-center shadow-inner overflow-hidden">
                <div class="absolute -top-12 -left-12 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl"></div>
                <div class="absolute -bottom-12 -right-12 w-24 h-24 bg-purple-500/10 rounded-full blur-xl"></div>
                <p id="problem" class="text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-200 to-white drop-shadow">?-?</p>
            </div>

            <!-- Input & Submit -->
            <div class="space-y-3">
                <input type="number" id="answer" placeholder="ป้อนคำตอบที่นี่..." autofocus autocomplete="off"
                    class="w-full bg-slate-950 border-2 border-slate-800 rounded-2xl px-4 py-3.5 text-center text-2xl font-bold text-cyan-300 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/20 transition-all duration-200">
                
                <button id="submit-btn" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[0.98] text-slate-950 font-black text-lg py-3.5 rounded-2xl shadow-lg shadow-cyan-500/25 transition-all duration-150 uppercase tracking-wider">
                    ส่งคำตอบ 🚀
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal (แทน Alert เดิม) -->
    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl scale-95 transition-all">
            <div id="modal-icon" class="text-5xl mb-3">🏆</div>
            <h3 id="modal-title" class="text-2xl font-bold mb-2">ผลการแข่งขัน</h3>
            <p id="modal-desc" class="text-slate-400 text-sm mb-6">คำอธิบาย</p>
            <button onclick="location.reload()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3 rounded-xl transition">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
        </html>
