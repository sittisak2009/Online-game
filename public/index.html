<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Battle Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Auth Box -->
        <div id="auth-box" class="card">
            <h2>🔐 เข้าสู่ระบบ</h2>
            <input type="text" id="auth-username" placeholder="ชื่อผู้ใช้">
            <input type="password" id="auth-password" placeholder="รหัสผ่าน">
            <select id="auth-country">
                <option value="TH">🇹🇭 ไทย</option>
                <option value="UK">🇬🇧 สหราชอาณาจักร</option>
                <option value="US">🇺🇸 สหรัฐอเมริกา</option>
                <option value="GB">🌐 Global</option>
            </select>
            <div class="btn-group">
                <button onclick="login()">เข้าสู่ระบบ</button>
                <button onclick="register()" class="btn-sec">สมัครสมาชิก</button>
            </div>
            <p id="auth-error" class="error-text"></p>
        </div>

        <!-- Lobby Box -->
        <div id="lobby-box" class="card hidden">
            <div style="margin-bottom: 12px;">
                <h3>สวัสดีคุณ <span id="display-user"></span></h3>
                <span id="display-rank" class="rank-badge">Bronze 🥉</span>
            </div>

            <div style="text-align: left;">
                <label>ระดับความยาก:</label>
                <select id="diff-select">
                    <option value="easy">ง่าย (บวก/ลบ ไม่เกิน 20)</option>
                    <option value="medium">ปานกลาง (คูณเลข 2 หลัก)</option>
                    <option value="hard">ยาก (หาร/คูณผสม)</option>
                </select>

                <label>เวลาต่อข้อ:</label>
                <select id="time-select">
                    <option value="5">5 วินาที</option>
                    <option value="10" selected>10 วินาที</option>
                    <option value="15">15 วินาที</option>
                    <option value="unlimited">ไม่จำกัดเวลา</option>
                </select>

                <label>จำนวนข้อ:</label>
                <select id="q-select">
                    <option value="5">5 ข้อ</option>
                    <option value="10" selected>10 ข้อ</option>
                    <option value="20">20 ข้อ</option>
                </select>
            </div>

            <button onclick="findMatch()" class="btn-start">🔍 ค้นหาคู่ดวล</button>
            <button onclick="getLeaderboard()" class="btn-sec">🏆 ตารางอันดับ</button>
            <p id="status-text" style="margin-top: 8px; color: #8b949e;"></p>
        </div>

        <!-- Game Arena -->
        <div id="game-box" class="card hidden">
            <div class="arena-header">
                <div>ข้อที่ <span id="q-num">1</span>/<span id="q-total">10</span></div>
                <div>⏱️ <span id="time-left">10</span>s</div>
            </div>

            <div id="arena-area">
                <div class="player-card" id="my-area">
                    <div id="p1-name" style="font-size: 0.9rem; color: #8b949e;">คุณ</div>
                    <div class="score" id="p1-score">0</div>
                    <div id="my-combo" style="color: #ff7b72; font-weight: bold; font-size: 0.8rem;"></div>
                </div>
                <div class="vs-text">VS</div>
                <div class="player-card" id="enemy-area">
                    <div id="p2-name" style="font-size: 0.9rem; color: #8b949e;">คู่ต่อสู้</div>
                    <div class="score" id="p2-score">0</div>
                </div>
            </div>

            <!-- Emote Bar -->
            <div class="emote-bar">
                <button onclick="sendEmote('🤣')">🤣</button>
                <button onclick="sendEmote('😎')">😎</button>
                <button onclick="sendEmote('💩')">💩</button>
                <button onclick="sendEmote('⚡')">⚡</button>
            </div>

            <div class="problem-display" id="problem-text">? + ?</div>
            <input type="number" id="answer-input" placeholder="พิมพ์คำตอบแล้วกด Enter" autofocus>
            <button onclick="submitAnswer()" class="btn-start">ตอบ</button>
        </div>

        <!-- Leaderboard Box -->
        <div id="lb-box" class="card hidden">
            <h2>🏆 ตารางอันดับ</h2>
            <div id="lb-list" style="margin: 15px 0;"></div>
            <button onclick="backToLobby()" class="btn-sec">กลับหน้าหลัก</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
