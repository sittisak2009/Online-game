<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Battle Arena ⚔️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white font-['Kanit'] min-h-screen flex items-center justify-center p-4">

    <div class="fixed inset-0 bg-gradient-to-tr from-cyan-950/30 via-slate-950 to-purple-950/30 pointer-events-none"></div>

    <main class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl shadow-cyan-950/50">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent italic">
                ⚔️ MATH BATTLE
            </h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Real-time Arena 1v1</p>
        </header>

        <!-- Screen 1: Lobby & Settings -->
        <div id="lobby-box" class="space-y-5">
            <div class="space-y-4 bg-slate-950/60 border border-slate-800 rounded-2xl p-5">
                
                <!-- Difficulty Selection -->
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2">ระดับความยาก</label>
                    <select id="difficulty-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                        <option value="easy">ง่าย (บวก-ลบ เลขไม่เกิน 20)</option>
                        <option value="medium" selected>ปานกลาง (บวก-ลบ-คูณ)</option>
                        <option value="hard">ยาก (คูณ-หาร เลขหลายหลัก)</option>
                    </select>
                </div>

                <!-- Time Limit Selection -->
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2">เวลาตอบต่อข้อ</label>
                    <select id="time-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                        <option value="5">5 วินาที (เร็วสุดขีด)</option>
                        <option value="10" selected>10 วินาที (กำลังดี)</option>
                        <option value="15">15 วินาที (มีเวลาคิด)</option>
                    </select>
                </div>
            </div>

            <button id="find-match-btn" 
                class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-[0.98] text-slate-950 font-black text-xl py-4 rounded-2xl shadow-lg shadow-cyan-500/25 transition-all duration-150 uppercase tracking-wider">
                🎮 เริ่มหาห้องแข่งขัน
            </button>
        </div>

        <!-- Screen 2: Searching -->
        <div id="status-box" class="hidden bg-slate-950/60 border border-slate-800/80 rounded-2xl p-6 text-center space-y-4 shadow-inner">
            <div class="flex items-center justify-center gap-2 text-amber-400 font-medium">
                <span class="inline-block w-3 h-3 rounded-full bg-amber-400 animate-ping"></span>
                <span id="status-text">กำลังค้นหาผู้เล่นที่เลือกเงื่อนไขตรงกัน...</span>
            </div>
            <div id="match-info" class="text-xs text-slate-400"></div>
            <button id="cancel-match-btn" class="text-xs text-rose-400 hover:underline">ยกเลิกการค้นหา</button>
        </div>

        <!-- Screen 3: Game Box -->
        <div id="game-box" class="hidden space-y-5">
            <!-- Scoreboard -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gradient-to-b from-cyan-950/40 to-slate-950 border border-cyan-500/30 rounded-2xl p-3 text-center">
                    <p class="text-xs text-cyan-400 font-semibold uppercase tracking-wider">YOU</p>
                    <p id="my-score" class="text-3xl font-black text-cyan-300">0</p>
                </div>
                <div class="bg-gradient-to-b from-rose-950/40 to-slate-950 border border-rose-500/30 rounded-2xl p-3 text-center">
                    <p class="text-xs text-rose-400 font-semibold uppercase tracking-wider">ENEMY</p>
                    <p id="opponent-score" class="text-3xl font-black text-rose-400">0</p>
                </div>
            </div>

            <!-- Timer Bar -->
            <div class="w-full bg-slate-950 border border-slate-800 rounded-full h-3 overflow-hidden p-0.5">
                <div id="timer-bar" class="bg-cyan-400 h-full rounded-full transition-all duration-200 w-full"></div>
            </div>

            <!-- Problem display -->
            <div class="relative bg-slate-950/80 border border-slate-800 rounded-2xl py-8 text-center shadow-inner overflow-hidden">
                <p id="problem" class="text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-200 to-white">?-?</p>
            </div>

            <!-- Input & Submit -->
            <div class="space-y-3">
                <input type="number" id="answer" placeholder="ป้อนคำตอบ..." autofocus autocomplete="off"
                    class="w-full bg-slate-950 border-2 border-slate-800 rounded-2xl px-4 py-3.5 text-center text-2xl font-bold text-cyan-300 placeholder-slate-600 focus:outline-none focus:border-cyan-500">
                <button id="submit-btn" 
                    class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-lg py-3.5 rounded-2xl shadow-lg transition-all uppercase">
                    ส่งคำตอบ 🚀
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl">
            <div id="modal-icon" class="text-5xl mb-3">🏆</div>
            <h3 id="modal-title" class="text-2xl font-bold mb-2">ผลการแข่งขัน</h3>
            <p id="modal-desc" class="text-slate-400 text-sm mb-6">คำอธิบาย</p>
            <button onclick="location.reload()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3 rounded-xl transition">
                กลับหน้าหลัก
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
    </html>
